name: Release build

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make zip

      - name: Build
        run: make all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xinput-builds
          path: |
            build.zip
            build_gh3.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build.zip
            build_gh3.zip
