[overrides]
force_gh_guitar=0

[santroller]
# Subtype when running under Wine/XInput without raw HID access
# Options: gh_guitar (default), rb_guitar, drums, live_guitar, turntable, gamepad
subtype=gh_guitar

[generic]
# Button order for HID gamepads that aren't recognised, the first entry is HID button 1
# Names: a, b, x, y, lb, rb, lt, rt, back, start, ls, rs, guide, up, down, left, right, none
# Add a [generic_VVVV_PPPP] section (e.g. [generic_7545_1073]) to set it for one controller
buttons=x,a,b,y,lb,rb,lt,rt,back,start,ls,rs,guide
