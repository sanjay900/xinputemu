[overrides]
force_gh_guitar=0

[generic]
# Settings for HID gamepads that aren't recognised. Add a [generic_VVVV_PPPP] section (e.g. [generic_7545_1073])
# to change them for one controller, anything not set there comes from here.
# buttons: what HID button 1, 2, 3... turn into
#   Names: a, b, x, y, lb, rb, lt, rt, back, start, ls, rs, guide, up, down, left, right, tilt, none
buttons=x,a,b,y,lb,rb,lt,rt,back,start,ls,rs,guide
# hat: what the hat's up, down, left and right turn into (same names as buttons)
# hat=up,down,left,right
# subtype: gamepad (default), gh_guitar, rb_guitar, drums, rb_drum, live_guitar, turntable
# lx, ly, rx, ry, lt, rt, triggers (one axis for both triggers): which axis drives that XInput axis, or none
#   Axes: x, y, z, rx, ry, rz, slider, dial, wheel, brake, accelerator
#   A trailing + or - only uses the axis from its centre to its max or min, a leading - flips it
#   e.g. rx=y- is the top half of the Y axis, resting at the centre
